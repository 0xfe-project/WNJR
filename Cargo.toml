[workspace]
members = [
    "wnjr-core",
    "njvm-io",
    "njvm-cli",
    "njvm-e2e",
    "wnjr-cli",
    "wnjr-tests",
    "wnjr-wasi",
    "tools/tracked-alloc",
    "tools/memprof-report",
    "tools/foldsim",
]
resolver = "2"

[workspace.package]
version = "0.7.0"

[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
strip = true
