[package]
name = "njvm-e2e"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "NJVM-IR end-to-end differential harness: WNJR vs bun, with and without a pass list"
license = "Apache-2.0"

[[bin]]
name = "njvm-e2e-wnjr"
path = "src/bin/njvm-e2e-wnjr.rs"

[dependencies]
wnjr-core = { path = "../wnjr-core" }
wnjr-wasi = { path = "../wnjr-wasi" }
serde_json = "1.0"
