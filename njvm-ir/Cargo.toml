[package]
name = "njvm-ir"
version.workspace = true
edition = "2021"
rust-version = "1.94"
description = "NJVM Intermediate Representation - type system and semantic IR"
license = "Apache-2.0"
keywords = ["wasm", "ir", "no_std"]
categories = ["wasm", "no-std"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc", "rc"] }
tracked_alloc = { package = "wnjr-tracked-alloc", version = "0.7.0", path = "../tools/tracked-alloc" }

[dev-dependencies]
rmp-serde = "1.3"
