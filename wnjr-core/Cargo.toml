[package]
name = "wnjr-core"
version.workspace = true
edition = "2021"
rust-version = "1.94"
description = "WASM NANO JIT RUNTIME"
license = "Apache-2.0"
documentation = "https://docs.rs/wnjr-core"
include = ["src/**", "!src/tmp/**", "build.rs", "examples/**", "tests/**", "README.md", "LICENSE"]
keywords = ["wasm", "webassembly", "jit", "no_std"]
categories = ["wasm", "no-std"]

[dependencies]
tracked_alloc = { package = "wnjr-tracked-alloc", version = "0.7.0", path = "../tools/tracked-alloc" }
parking_lot = "0.12"

wasm-encoder = { version = "0.246.2", default-features = false }

[dev-dependencies]
wat = "1.246.2"
wasmparser = "0.246.2"
wnjr-wasi = { path = "../wnjr-wasi" }


